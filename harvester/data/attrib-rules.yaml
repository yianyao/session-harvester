# 归因规则表（attrib）——本项目自定义：把"同一语义的不同字面"归一，产出根因候选。
#
# 铁律（SOP-attrib-review.md §0 A2/A3、TODO-attrib-review-P6.md 红线 #9）：
#   规则放**数据文件**，不放 .py —— 写进代码就重演 errstats._RULES 的困境
#   （英文短语正则写死在源码里，新 Harness 接入时无人重审）。
#
# 为什么本文件在 harvester/data/ 而不是 docs/：
#   docs/ 整个目录被 .gitignore:32 忽略（见 TODO P6 的 X-7 勘误），放那里等于
#   规则表不进版本库、换机即丢，与 A2 的"可被重审"理由直接矛盾。
#   本文件随包分发（pyproject [tool.setuptools.package-data]），先例同
#   harvester/data/stopwords_zh.txt（kwstats.py:88 用 __file__ 定位）。
#
# 四要素（缺任一 → 加载即失败，fail loud；见 harvester/attrib.py）：
#   match  至少一条非空字符串（字面/正则片段，大小写不敏感）
#   class  必须在 errstats.CLASSES 内（env/tool_interface/context/unclassified）
#          —— 复用既有四分类，不另造分类体系
#   why    根因候选（人读的一句话；**是候选，不是裁决**）
#   fix    应对候选（知道有病还得有药方，否则上首页只增焦虑）
# 另两个非四要素但强烈建议填的字段：
#   confidence  high|medium|low（默认 medium）
#   verified    人核过这条规则的日期（YYYY-MM-DD）；缺省表示尚未人工核验
#
# 语义分层（SOP §3.1，绝不可混）：
#   ① 事实 fact —— 机器算得出、零判断（计数/锚点/交叉表）      【errstats 已有】
#   ② 归因 attribution —— 机器出候选、**会错**（本文件 + attrib.py）【本层】
#   ③ 裁决 verdict —— 只有人能下（attribations 台账）          【永不进本文件】

version: 1
rules:
  - id: AR-001
    class: tool_interface
    match: ["FS_NOT_OBSERVED", "file has not been read", "not been read yet"]
    why: 编辑前未读文件——机制要求先观察后写，违反即被拒
    fix: 提示词前置「改任何文件前先 read」；或工具层把 read 并入 edit 原子操作
    confidence: high
    verified: "2026-10-22"

  - id: AR-002
    class: tool_interface
    match: ["FS_EDIT_NOT_FOUND", "workspace_edit_match_not_found",
            "apply_patch_match_not_found", "String to replace not found",
            "replace not found in file", "Edit error on",
            "old_string and new_string are exactly the same",
            "old_string and new_string must differ"]
    why: 编辑未命中或编辑无效——待替换文本与实际内容不符，或 old/new 完全相同
    fix: 编辑前先用 read/Grep 取回真实文本，按原文整段替换；改前不做整文件改写
    confidence: high
    verified: "2026-10-22"
    # ⚠ 刻意**不**收裸 "old_string" 作匹配项：实测它会劫持
    #   "File not found: <path>. Use an empty old_string to create a new file."
    #   ——那条的真实根因是**文件不存在**（context，归 AR-004），不是编辑未命中。
    #   这正是 A1「归因会错」的实例：匹配词太弱 → 归错类。规则序即优先级，
    #   故 AR-004 也排在 AR-002 之后，靠这里收紧而不是靠顺序兜。

  - id: AR-003
    class: tool_interface
    match: ["FS_STALE_VERSION", "file changed since it was read"]
    why: 文件被外部改过，读到的版本已过期——继续写会覆盖别人的改动
    fix: 重读该文件后再编辑；批量改动前先确认没有并发写入者
    confidence: high
    verified: "2026-10-22"

  # ── 以下四条来自 2026-10-22 刷库后实测（attrib --brief 的未归因 top 清单），
  #    每条都先看到真实错误串与次数才立，不是凭空想出来的规则 ──────────
  - id: AR-004
    class: context
    match: ["FS_NOT_FOUND", "Search path is not accessible",
            "filesystem_not_found", "no such file or directory",
            "file no longer exists", "File not found", "does not exist"]
    why: 目标路径不存在——文件/目录已被移动、删除，或路径本身写错
    fix: 先用 ls/Glob 确认路径存在再操作；批量处理前先枚举目录而不是猜路径
    confidence: high
    verified: "2026-10-22"
    # 说明：`File not found` 是 prose 形态、`FS_NOT_FOUND` 是 DSH 码形态，
    #   同一条规则同时收——这正是本层存在的理由（同一语义、不同字面）。

  - id: AR-005
    class: env
    match: ["WEB_PROVIDER_ERROR"]
    why: 联网检索服务端故障——web_fetch 的上游 provider 报错，非本地可修
    fix: 重试或换检索词；连续失败时改走本地检索（search）而不是反复重试同一 URL
    confidence: medium
    verified: "2026-10-22"

  - id: AR-006
    class: tool_interface
    match: ["subagent depth", "exceeds maxDepth"]
    why: 子代理嵌套超过平台上限——调用方没意识到自己已在子代理内
    fix: 由主会话承担再分发；子代理内需要并行时分派给平级而非再嵌套
    confidence: high
    verified: "2026-10-22"

  - id: AR-007
    class: env
    match: ["tool_permission_revoked"]
    why: 工具权限被撤销——授权范围在会话中途变化，agent 无法自愈
    fix: 重新申请该工具的授权；批量操作前先确认授权仍在有效期内
    confidence: high
    verified: "2026-10-22"

  # ══════════════ P6-1 增量（2026-10-23）══════════════
  # 来源：`attrib --json` 实测的 48 个未归因模式（131 条错误），逐条看**真实错误串**
  # 之后才立（清单留档 docs/reports/unattributed-p69.txt）。规则序即优先级：
  # 这些排在 AR-001..007 之后 → 只接"前面没人认领"的串，不会改写既有归因。
  # ⚠ 仍未归因的那几条（如 `tool_executor_failed` / `ABORTED`）**故意不立规则**：
  #   看不到具体根因就不编，宁可让覆盖度停在实测值。

  - id: AR-008
    class: env
    match: ["sandbox-center cmd decisionRecord missing actual resource subject",
            "SetNamedSecurityInfoW failed", "FS_SANDBOX_DENIED",
            "ReplaceFileW EIO"]
    why: 沙箱层拒绝写入——为工作区授写权限（ACL）时失败，操作停在沙箱而不是工具
    fix: 用 diagnose-windows-sandbox-acl 诊断该路径；或把写入改到已授权目录
    confidence: high
    verified: "2026-10-23"

  - id: AR-009
    class: env
    match: ["EPERM: operation not permitted"]
    why: Windows 上目标文件被占用或目录不可写——原子改名/建目录被系统拒绝
    fix: 关掉占用该文件的进程再重试；批量写前先确认目标目录可写
    confidence: high
    verified: "2026-10-23"

  - id: AR-010
    class: env
    match: ["Permission to use"]
    why: 平台权限层拒绝了该次调用（未获批或策略禁止），agent 自身无法绕过
    fix: 改用已授权的只读工具，或先向用户申请该操作；批量探测前先确认授权边界
    confidence: high
    verified: "2026-10-23"

  - id: AR-011
    class: tool_interface
    match: ["FS_AMBIGUOUS_EDIT",
            "Found [0-9]+ matches of the string to replace"]
    why: 待替换文本在文件里多处命中，工具无法确定改哪一处
    fix: 给足上下文（前后各几行）再替换，或显式 replace_all
    confidence: high
    verified: "2026-10-23"

  - id: AR-012
    class: tool_interface
    match: ["exceeds maximum allowed tokens"]
    why: 工具结果超过单次返回上限，被落盘截断——拿到的是路径而不是内容
    fix: 收窄查询范围/分页读取落盘文件，别整段读大文件
    confidence: high
    verified: "2026-10-23"

  - id: AR-013
    class: env
    match: ["during web fetch", "URL redirected to different host"]
    why: 联网抓取失败——上游不可达，或跨主机重定向被拒（非本地可修）
    fix: 换检索词或镜像源；连续失败改走本地 search，别反复重试同一 URL
    confidence: high
    verified: "2026-10-23"

  - id: AR-014
    class: tool_interface
    match: ["tool_input_invalid", "Invalid arguments for ",
            "SEARCH_INVALID_PATTERN", "run_checklist_multiple_in_progress",
            "tool_result_recall_invalid", "browser_wait_invalid",
            "browser_timeout_invalid"]
    why: 调用参数不符合工具 schema（缺必填、取值非法，或状态冲突）
    fix: 按报错里的 required 列表补齐参数；同一时刻只保留一个进行中的 checklist
    confidence: high
    verified: "2026-10-23"

  - id: AR-015
    class: context
    match: ["Can not find skill", "skill_asset_invalid",
            "skill_asset_not_executable", "UNKNOWN_TOOL",
            "No installed connector named", "unknown job "]
    why: 引用的技能/工具/作业不存在或不可执行——名字写错、未安装或已过期
    fix: 先列举已安装项（skills/tools/connectors）再引用；名称照注册名原样抄
    confidence: high
    verified: "2026-10-23"

  - id: AR-016
    class: env
    match: ["Search time(?:d out|out) after", "TOOL_TIMEOUT"]
    why: 本地检索或工具执行超时——范围太大或底层卡住，不是结果为空
    fix: 缩小范围（限定目录/关键词）后重试；持续超时改分批读
    confidence: medium
    verified: "2026-10-23"
    # ⚠ 上面写成 `Search time(?:d out|out) after` 是为了同时接 `Search timeout after`
    #   与 `Search timed out after` 两种字面（实测只见到前者）。刻意不写裸
    #   `timeout`：那会把 `browser_timeout_invalid`（参数非法，归 AR-014）劫持过来。

  - id: AR-017
    class: env
    match: ["browser_instance_unknown", "browser_cancelled"]
    why: 浏览器会话状态丢失——实例未注册或操作被取消，需重建会话
    fix: 重新打开浏览器实例再操作；长流程中间别手动关闭窗口
    confidence: medium
    verified: "2026-10-23"

  - id: AR-018
    class: context
    match: ["artifact_secret_detected"]
    why: 产物里检出疑似密钥/凭据，落盘或导出被安全门拦下
    fix: 把密钥替换成占位符或从产物中剔除后再重试
    confidence: high
    verified: "2026-10-23"

  - id: AR-019
    class: env
    match: ["SEARCH_FAILED"]
    why: 检索请求整体失败（索引或上游不可用），没有返回任何结果
    fix: 重试一次；持续失败时缩小范围或改用文件内 Grep
    confidence: medium
    verified: "2026-10-23"

  - id: AR-020
    class: tool_interface
    match: ["memory_tool_cursor_run_mismatch"]
    why: 记忆工具的游标与当前 run 不匹配——会话恢复后状态错位
    fix: 重置游标（从当前 run 重新取），不要跨 run 复用旧游标
    confidence: medium
    verified: "2026-10-23"

  - id: AR-021
    class: env
    match: ["host_bridge_declared_error", "socket hang up"]
    why: 与宿主/上游的连接层故障——桥接层报错或连接被对端断开
    fix: 重试该调用；连续断开时查宿主进程与网络，而不是改提示词
    confidence: low
    verified: "2026-10-23"

  - id: AR-022
    class: context
    match: ["plan_changes_requested"]
    why: 计划被要求修改——这是正常的评审往返，不是工具故障
    fix: 按评审意见改计划后重新提交审阅
    confidence: high
    verified: "2026-10-23"

  - id: AR-023
    class: tool_interface
    match: ["FS_NOT_TEXT", "filesystem_offset_out_of_range"]
    why: 文件读取方式不对——按文本读二进制，或偏移超出文件长度
    fix: 先确认文件类型与大小再读；二进制走对应解析器，偏移从文件头算
    confidence: medium
    verified: "2026-10-23"

  - id: AR-024
    class: tool_interface
    match: ["browser_element_obscured"]
    why: 目标元素被其它元素遮挡，点击/输入落在遮挡物上
    fix: 先滚到可视区并关掉遮挡弹层，再用稳定选择器定位可点击元素
    confidence: medium
    verified: "2026-10-23"

# ─────────────────────────────────────────────────────────────────────────────
# 第④步（用户 2026-10-23 批准「把 why/fix 推广到 tools / chains / skills」）
#
# 每条的 `face` 决定 `match` 打在**哪种串**上（缺省 errors，见 attrib.FACES）：
#   tools  —— 工具名（`toolstats` 的 tool；锚点 §是 name，故用 ^…$ 定界）
#   chains —— 卡片/chain 审计的结论文案（`cards.validate_cards` 的 warn/error）
#   skills —— skill 面状态词（`待鉴定` / `低样本`）
#
# 为什么 tools 规则要按工具名而不是错误串：错误串那一路已由 errors 面的 24 条
# 规则覆盖；工具这一层的问题是**这个工具系统性地会怎么失败**。锚点来自实测
# （docs/reports/probe-tool-patterns.py，2026-10-23 真库）：
#   edit   : FS_STALE_VERSION 37.8% / FS_NOT_OBSERVED 26.5% / FS_EDIT_NOT_FOUND 17.3%
#   Edit   : 目标串找不到 75.9%
#   web_fetch: WEB_PROVIDER_ERROR 97.6%
#   read   : tool_permission_revoked 58.3% / FS_NOT_FOUND 36.1%
#   write  : 未读先写 55.6%（Write 大写口径 89.5%）
#   Bash   : sandbox decisionRecord 缺资源主体 76.5%
#   Grep   : 搜索路径不存在 81.2%
# 每条 why 里的百分比都是上面那次数出来的，不是估计值；数据一变就该重算。
# ─────────────────────────────────────────────────────────────────────────────

  - id: AR-T01
    face: tools
    class: tool_interface
    match: ["^edit$"]
    why: 编辑前没读、或读的是旧版本——FS_STALE_VERSION 37.8%、FS_NOT_OBSERVED 26.5%、
      FS_EDIT_NOT_FOUND 17.3%（2026-10-23 前 74/52/34 次）
    fix: 每次 Edit 前先 Read 目标文件；一处改一次，冲突后重读再改（别拿旧内容硬套）
    confidence: high
    verified: "2026-10-23"

  - id: AR-T02
    face: tools
    class: env
    match: ["^web_fetch$"]
    why: 几乎全是 WEB_PROVIDER_ERROR（97.6%，41/42）——抓取服务侧失败，不是你 URL 写错
    fix: 换源，或先用 web_search 定位再抓；同一 URL 别连打（这类里 16 次标了"放弃"）
    confidence: high
    verified: "2026-10-23"

  - id: AR-T03
    face: tools
    class: env
    match: ["^read$"]
    why: 过半是权限被撤销（tool_permission_revoked 58.3%），其次文件不存在（36.1%）
    fix: 换可读路径或先申请权限；不在循环里重试同一路径（权限类重试不会变好）
    confidence: high
    verified: "2026-10-23"

  - id: AR-T04
    face: tools
    class: tool_interface
    match: ["^write$"]
    why: 未读先写（大写 Write 口径 89.5%）或版本过期（小写 write 口径 55.6%）
    fix: 先 Read 再 Write；一次写的范围小一点，减少与其它写入撞版本
    confidence: high
    verified: "2026-10-23"

  - id: AR-T05
    face: tools
    class: env
    match: ["^bash$"]
    why: 沙箱裁决记录缺"资源主体"（76.5%，13/17）——命令没被识别出要动哪个资源
    fix: 用显式路径参数，避免在管道/重定向里隐式读写；必要时拆成两条命令
    confidence: medium
    verified: "2026-10-23"

  - id: AR-T06
    face: tools
    class: tool_interface
    match: ["^grep$"]
    why: 搜索路径不存在（81.2%，13/16）——路径拼错或目录已被移走
    fix: 先 glob / Test-Path 确认目录存在，再 grep
    confidence: high
    verified: "2026-10-23"

  - id: AR-C01
    face: chains
    class: tool_interface
    match: ["frontmatter 缺失或不可解析"]
    why: 卡片没有可解析的 YAML 头（§8 规范要求）——机器读不到任何字段，等于不是卡
    fix: 用 `cards new` 重新生成脚手架，或手工补 frontmatter 后重跑 `cards validate`
    confidence: high
    verified: "2026-10-23"

  - id: AR-C02
    face: chains
    class: context
    match: ["不在索引库"]
    why: 锚点指向的会话不在索引库——锚点失效（换机/换库）或 sid 前缀写错
    fix: 先跑 `sync` 把会话收进来，再核对锚点 sid 是否带源前缀
    confidence: high
    verified: "2026-10-23"

  - id: AR-C03
    face: chains
    class: tool_interface
    match: ["未在锚点会话原文中找到"]
    why: evidence 与锚点回合原文不一致——抄错、或经 adapter 改写后没复核
    fix: 打开锚点回合逐字核对，改卡或改引文；别把"大意一致"当通过
    confidence: high
    verified: "2026-10-23"

  - id: AR-C04
    face: chains
    class: tool_interface
    match: ["定位精度不足"]
    why: 锚点缺回合号（turn 为 null），只能定位到会话、定位不到是哪一轮
    fix: 补回合号（seq）再校验——三跳定位靠它才能回原文
    confidence: high
    verified: "2026-10-23"

  - id: AR-S01
    face: skills
    class: context
    match: ["待鉴定"]
    why: 这个 skill 有调用但没有定论——还没判它是好用法还是坑
    fix: 看锚点回合确认，然后定稿成卡片或记进班规；别让它一直悬着
    confidence: medium
    verified: "2026-10-23"

  - id: AR-S02
    face: skills
    class: context
    match: ["低样本", "low-sample"]
    why: 调用次数太少，失败率不可比（1 次调用 1 次失败也是 100%）
    fix: 攒样本，或只看绝对失败次数；别用小样本下结论
    confidence: high
    verified: "2026-10-23"